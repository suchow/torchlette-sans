# Torchlette Sans: the checks of source/Makefile, run here and not on a laptop.
#
# check   a clean rebuild of the release (the fourteen .ttf, their woff2, and the variable
#         font), uploaded as release-rebuild. Pull requests that do not touch fonts/ run
#         make release-rebuild; pull requests that touch fonts/, non-PR events, and runs
#         with missing or ambiguous base refs run the full byte comparison (make check).
# verify  the HarfBuzz checks of all fourteen styles and their web subsets, then the
#         fontbakery gate (make verify); the fontbakery report is kept as an artifact
#
# The Makefile pins Python 3.12 and every tool through uv, so the jobs need only uv.
# make check-web and the lesson prose that make verify shapes need the torchlette
# repository beside this one; it is private, so neither runs here, and verify_ss16.py
# shapes its own test strings only (the Makefile drops LEVELS_DIR when it is absent).

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The release is built on an Apple silicon Mac, with the universal2 wheels of
    # skia-pathops and ttfautohint-py and macOS's libm. A Linux build uses other
    # binaries, compiled by another compiler for another processor, and a floating-point
    # difference of one ulp can move a rounded coordinate; so the rebuild runs on
    # an arm64 Mac too. The variable font alone takes about 9 minutes.
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      # Fetch depth 2 on pull_request brings both parents of refs/pull/<n>/merge so
      # HEAD^1 vs. HEAD diffs only the PR's net changes without cloning binary history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: source/Makefile
      - name: Decide whether to compare rebuilt release against fonts/
        id: compare
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHECKOUT_REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          compare=true
          reason="defaulting to full comparison"

          is_sha() {
            [[ "${1:-}" =~ ^[0-9a-f]{40}$ ]]
          }

          if [ "${EVENT_NAME:-}" != "pull_request" ]; then
            reason="event ${EVENT_NAME:-unknown} is not pull_request"
          elif ! is_sha "${BASE_SHA:-}" || ! is_sha "${HEAD_SHA:-}"; then
            reason="missing or invalid pull_request base/head SHA"
          else
            parents=$(git rev-list --parents -n 1 HEAD 2>/dev/null || true)
            base_ref=""

            if [ -z "$parents" ]; then
              reason="unable to read HEAD parents"
            else
              set -- $parents
              case "${CHECKOUT_REF:-}" in
                refs/pull/*/merge)
                  if [ "$#" -eq 3 ] && is_sha "$1" && is_sha "$2" && is_sha "$3" \
                     && [ "$1" != "$HEAD_SHA" ] && [ "$3" = "$HEAD_SHA" ] \
                     && git cat-file -e "${2}^{commit}" 2>/dev/null \
                     && git cat-file -e "${2}^{tree}" 2>/dev/null; then
                    base_ref="$2"
                    if [ "$2" != "$BASE_SHA" ]; then
                      echo "Note: PR merge parent $2 differs from event base SHA $BASE_SHA; diffing against merge parent."
                    fi
                  else
                    reason="PR merge commit parents are missing or ambiguous"
                  fi
                  ;;
                *)
                  if [ "$#" -ge 1 ] && [ "$1" = "$HEAD_SHA" ] \
                     && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
                     && git cat-file -e "${BASE_SHA}^{tree}" 2>/dev/null; then
                    merge_bases=$(git merge-base --all "$BASE_SHA" HEAD 2>/dev/null || true)
                    if [ -z "$merge_bases" ]; then
                      reason="base ref $BASE_SHA has no local merge-base"
                    else
                      set -- $merge_bases
                      if [ "$#" -eq 1 ] && is_sha "$1" \
                         && git cat-file -e "${1}^{commit}" 2>/dev/null \
                         && git cat-file -e "${1}^{tree}" 2>/dev/null; then
                        base_ref="$1"
                      else
                        reason="base ref $BASE_SHA has ambiguous merge-bases ($# found)"
                      fi
                    fi
                  else
                    reason="checked-out ref ${CHECKOUT_REF:-unknown} has missing or ambiguous base ref"
                  fi
                  ;;
              esac
            fi

            if [ -n "$base_ref" ]; then
              if fonts_diff=$(git diff --no-renames --name-only "$base_ref" HEAD -- fonts); then
                if [ -n "$fonts_diff" ]; then
                  reason="fonts/ changed relative to $base_ref"
                  echo "Changed files under fonts/:"
                  printf '%s\n' "$fonts_diff"
                else
                  compare=false
                  reason="source-only PR (fonts/ unchanged relative to $base_ref)"
                fi
              else
                reason="git diff against $base_ref failed"
              fi
            fi
          fi

          echo "compare=$compare ($reason)"
          echo "compare=$compare" >> "$GITHUB_OUTPUT"
      - name: Rebuild release and compare when required
        env:
          COMPARE: ${{ steps.compare.outputs.compare }}
        run: |
          cd source
          if [ "$COMPARE" = "false" ]; then
            make -j"$(sysctl -n hw.ncpu)" release-rebuild
          else
            make -j"$(sysctl -n hw.ncpu)" check
          fi
      # The rebuilt release, kept whether or not it matches fonts/: when the sources
      # have changed, these are the files to look at and the next release's files.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-rebuild
          path: source/build/release
          if-no-files-found: ignore

  verify:
    # The checks test what the fonts do, not their bytes, so Linux will do; the old
    # fonts job in the torchlette repository ran them there on four styles.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: source/Makefile
      - run: cd source && make -j"$(nproc)" verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fontbakery-report
          path: |
            source/build/fontbakery.md
            source/build/fontbakery.json
          if-no-files-found: ignore
