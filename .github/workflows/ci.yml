# Disposable Regular-only intermediate-width trial. Do not merge this workflow.
name: regular-width-range
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: source/Makefile
      - name: Build Regular control and intermediate-width trial
        run: |
          cd source
          make MODULES=none build/TorchletteSans-Regular.ttf
          uv run -q --no-project --python 3.12 --with fonttools==4.68.0 --with skia-pathops==0.9.2 python width_trial.py build/TorchletteSans-Regular.ttf build/width-range
      - uses: actions/upload-artifact@v4
        with:
          name: regular-width-range
          path: source/build/width-range/
          if-no-files-found: error
