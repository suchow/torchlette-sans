# Temporary Regular-only specimen build for issue 42. Keep this branch unmerged.
name: petite-capital-trial

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: source/Makefile
      - name: Build Regular petite-capital specimen font
        run: |
          cd source
          SC_SCALE=0.6666666667 make MODULES=none build/TorchletteSans-Regular.ttf
      - uses: actions/upload-artifact@v4
        with:
          name: petite-capital-trial
          path: source/build/TorchletteSans-Regular.ttf
          if-no-files-found: error
